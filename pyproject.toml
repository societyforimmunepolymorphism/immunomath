[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "immunomath"
version = "0.4.1"
description = "Metrognome: rigorous, reproducible evaluation of probabilistic genetic inference. Keeping probabilistic genetics honest."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Society for Immune Polymorphism (SIP)" },
]
keywords = [
    "probabilistic-forecasting",
    "proper-scoring-rules",
    "calibration",
    "HLA",
    "genetics",
    "imputation",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/societyforimmunepolymorphism/immunomath"
Repository = "https://github.com/societyforimmunepolymorphism/immunomath"
Documentation = "https://github.com/societyforimmunepolymorphism/immunomath"
Issues = "https://github.com/societyforimmunepolymorphism/immunomath/issues"

[project.optional-dependencies]
reporting = [
    "plotly>=5.20",
    "pyarrow>=15",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "plotly>=5.20",
    "pyarrow>=15",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/immunomath"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
]
ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Deliberate typographic characters (minus, en dash, infinity) in user-facing report text.
"src/immunomath/reporting/report.py" = ["RUF001"]
"tests/test_analysis_reporting.py" = ["RUF001"]
# User-facing Streamlit UI strings use math symbols (λ, γ, Σ, −, ·) deliberately.
"examples/streamlit_app.py" = ["RUF001"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["src/immunomath"]

[[tool.mypy.overrides]]
# SciPy does not ship type stubs for scipy.stats (used only for the BCa
# bootstrap's normal quantiles). Allow the untyped import without relaxing
# strictness anywhere else in the package.
module = ["plotly.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["immunomath"]
branch = true
