site_name: ImmunoMath
site_description: "Metrognome — rigorous, reproducible evaluation of probabilistic genetic inference. Keeping probabilistic genetics honest."
site_url: https://github.com/societyforimmunepolymorphism/immunomath
repo_url: https://github.com/societyforimmunepolymorphism/immunomath
repo_name: societyforimmunepolymorphism/immunomath
copyright: "Copyright &copy; Society for Immune Polymorphism (SIP). Licensed under Apache-2.0."

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Mathematical Foundations:
      - Probability Distributions: mathematical-foundations/probability-distributions.md
      - Logarithmic Score: mathematical-foundations/logarithmic-score.md
      - Brier Score: mathematical-foundations/brier-score.md
      - Proper Scoring vs. Descriptive Metrics: mathematical-foundations/proper-vs-descriptive.md
      - Cohort Assessment: mathematical-foundations/cohort-assessment.md
      - Uncertainty (Bootstrap): mathematical-foundations/uncertainty.md
      - Loss-Distribution Quantiles: mathematical-foundations/quantiles.md
      - Catastrophic-Error Analysis: mathematical-foundations/catastrophic-error.md
      - Comparative Assessment: mathematical-foundations/comparative-assessment.md
      - Weighted Scoring (TRS-Aware): mathematical-foundations/weighted-scoring.md
      - Calibration: mathematical-foundations/calibration.md
      - Risk-Coverage and Abstention: mathematical-foundations/risk-coverage.md
  - User Guide:
      - Reports and Output: user-guide/reporting.md
  - Tutorials:
      - "1. Evaluating a Single Distribution": tutorials/01-single-distribution.md
      - "2. Evaluating 1,000 Individuals": tutorials/02-cohort.md
      - "3. Comparing Two Algorithms": tutorials/03-compare-algorithms.md
      - "4. Population vs Global Panel": tutorials/04-compare-panels.md
      - "6. Constructing a Calibration Diagram": tutorials/06-calibration.md
      - "7. Evaluating Allele-Presence Probabilities": tutorials/07-event-calibration.md
  - Development:
      - Reproducibility: development/reproducibility.md
  - API Reference:
      - Distributions: api/distributions.md
      - Scoring: api/scoring.md
      - Diagnostics: api/diagnostics.md
      - Cohort: api/cohort.md
      - Statistics: api/statistics.md
      - Catastrophic Errors: api/catastrophic.md
      - Comparative Assessment: api/comparison.md
      - Weighted Scoring (TRS-Aware): api/weighting.md
      - Calibration and Risk-Coverage: api/calibration.md
      - Analysis and Reporting: api/reporting.md
