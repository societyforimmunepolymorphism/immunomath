name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lock-check:
    name: uv.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Check lockfile matches pyproject.toml
        run: uv lock --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lock-check
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync environment (locked)
        run: uv sync --locked --extra dev --extra docs --extra reporting --python ${{ matrix.python-version }}
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (with doctests)
        run: uv run pytest --doctest-modules src/immunomath tests
      - name: Build install artifact
        run: uv build
      - name: Documentation build (strict)
        run: uv run mkdocs build --strict
