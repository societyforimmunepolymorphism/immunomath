name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev + docs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (with doctests)
        run: pytest --doctest-modules src/immunomath tests
      - name: Build install artifact
        run: |
          pip install build
          python -m build
      - name: Documentation build (strict)
        run: mkdocs build --strict
